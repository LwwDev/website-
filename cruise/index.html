<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise Access | Liam Wohlstedt</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(16, 16, 16, 0.92);
            --panel-strong: rgba(12, 12, 12, 0.96);
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.14);
            --text: #f2f2ef;
            --muted: #9b9b97;
            --accent: #c7c7c2;
            --accent-strong: #ffffff;
            --danger: #ef9c9c;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.05), transparent 26%),
                radial-gradient(circle at bottom right, rgba(128, 163, 196, 0.1), transparent 24%),
                linear-gradient(180deg, #060606 0%, #090909 100%);
            color: var(--text);
            font-family: "IBM Plex Mono", monospace;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.02) 50%, transparent 100%),
                repeating-linear-gradient(
                    180deg,
                    transparent 0,
                    transparent 22px,
                    rgba(255,255,255,0.015) 22px,
                    rgba(255,255,255,0.015) 23px
                );
            pointer-events: none;
        }

        .gate {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 40px 20px 80px;
            position: relative;
            z-index: 1;
        }

        .panel {
            width: min(100%, 520px);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .eyebrow, .viewer-meta {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 11px;
            font-weight: 600;
        }

        h1 {
            font-family: "Newsreader", serif;
            font-weight: 500;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 0.95;
            margin: 18px 0 12px;
            color: var(--text);
        }

        .copy, .viewer-copy {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
            font-weight: 400;
        }

        .title-accent {
            color: var(--accent-strong);
        }

        .panel-top {
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.06), transparent 32%),
                linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%);
            margin: -32px -28px 22px;
            padding: 30px 28px 22px;
            border-radius: 28px 28px 0 0;
            border-bottom: 1px solid var(--line);
        }

        form {
            margin-top: 20px;
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 500;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            padding: 14px 15px;
            font: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .submit-btn, .logout-btn {
            border: 0;
            border-radius: 999px;
            padding: 14px 18px;
            background: var(--text);
            color: #090909;
            font-weight: 600;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }

        .submit-btn:hover, .logout-btn:hover {
            transform: translateY(-1px);
        }

        .submit-btn:disabled, .logout-btn:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .status {
            min-height: 22px;
            margin-top: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--accent);
        }

        .viewer {
            display: none;
            min-height: 100vh;
            flex-direction: column;
        }

        .viewer.is-visible {
            display: flex;
        }

        .viewer-header {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            padding: 16px 20px;
            background: var(--panel-strong);
            border-bottom: 1px solid var(--line-strong);
            backdrop-filter: blur(18px);
        }

        .viewer-copy {
            margin-top: 6px;
            font-size: 13px;
        }

        .viewer-frame {
            flex: 1;
            width: 100%;
            border: 0;
            min-height: calc(100vh - 78px);
            background: #fff;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 720px) {
            .panel {
                padding: 24px 20px;
                border-radius: 24px;
            }

            .panel-top {
                margin: -24px -20px 20px;
                padding: 24px 20px 18px;
            }

            .viewer-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <main id="gate" class="gate">
            <section class="panel">
                <div class="panel-top">
                    <div class="eyebrow">Private Route</div>
                    <h1>Cruise<br><span class="title-accent">Access</span></h1>
                </div>

                <form id="login-form">
                    <label>
                        Name
                        <input id="username" type="text" name="username" autocomplete="username" required>
                    </label>

                    <button id="submit-btn" class="submit-btn" type="submit">Unlock Cruise Page</button>
                </form>

                <p id="status" class="status" aria-live="polite"></p>
            </section>
        </main>

        <section id="viewer" class="viewer" aria-live="polite">
            <header class="viewer-header">
                <div>
                    <div class="viewer-meta">Authenticated View</div>
                    <div class="viewer-copy">The trip page below is loaded after the name check passes.</div>
                </div>
                <button id="logout-btn" class="logout-btn" type="button">Lock Page</button>
            </header>
            <iframe id="viewer-frame" class="viewer-frame" title="Cruise plan"></iframe>
        </section>
    </div>

    <script>
        const gate = document.getElementById('gate');
        const viewer = document.getElementById('viewer');
        const viewerFrame = document.getElementById('viewer-frame');
        const status = document.getElementById('status');
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const allowedNames = new Set(['erica', 'liam']);

        function setStatus(message, type = '') {
            status.textContent = message;
            status.className = type ? `status ${type}` : 'status';
        }

        function setBusy(isBusy) {
            submitBtn.disabled = isBusy;
            logoutBtn.disabled = isBusy;
        }

        function showGate() {
            gate.classList.remove('hidden');
            viewer.classList.remove('is-visible');
        }

        function showViewer() {
            gate.classList.add('hidden');
            viewer.classList.add('is-visible');
        }

        async function loadCruisePage() {
            setBusy(true);
            setStatus('Opening the cruise page...', 'success');

            const response = await fetch('/api/cruise-content', { cache: 'no-store' });
            if (!response.ok) {
                showGate();
                setBusy(false);
                setStatus('The private cruise page could not be loaded right now.', 'error');
                return;
            }

            const html = await response.text();
            viewerFrame.srcdoc = html;
            showViewer();
            setBusy(false);
            setStatus('');
        }

        async function handleLogin(event) {
            event.preventDefault();

            const formData = new FormData(form);
            const username = String(formData.get('username') ?? '').trim().toLowerCase();

            setBusy(true);
            setStatus('Checking name...', 'success');

            if (!allowedNames.has(username)) {
                window.location.replace('https://liamwohlstedt.xyz');
                return;
            }

            try {
                sessionStorage.setItem('cruise_access', 'granted');
            } catch {
                // ignore storage failures and continue
            }

            await loadCruisePage();
        }

        async function handleLogout() {
            setBusy(true);
            try {
                sessionStorage.removeItem('cruise_access');
            } catch {
                // ignore storage failures
            }
            viewerFrame.srcdoc = '';
            showGate();
            setBusy(false);
            setStatus('The private page is locked again.');
        }

        form.addEventListener('submit', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);

        async function boot() {
            try {
                const hasAccess = sessionStorage.getItem('cruise_access') === 'granted';
                if (hasAccess) {
                    await loadCruisePage();
                }
            } catch {}
        }

        void boot();
    </script>
</body>
</html>
